<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AmoreItalia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#f0f2f5;display:flex;justify-content:center;height:100dvh;overflow:hidden}
.app{width:100%;max-width:450px;background:#fff;height:100dvh;display:flex;flex-direction:column;position:relative}
#auth{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#ff4b6e,#ff758c);z-index:99;display:flex;justify-content:center;align-items:center;padding:20px}
.box{background:#fff;padding:25px;border-radius:20px;width:100%;max-width:350px;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,0.2)}
.box h2{color:#ff4b6e;margin-bottom:10px}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.btn{background:#ff4b6e;color:#fff;border:none;padding:12px;border-radius:25px;font-size:16px;font-weight:bold;width:100%;margin-top:10px;cursor:pointer}
.hdr{padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.logo{font-size:20px;font-weight:800;color:#ff4b6e}
.main{flex:1;padding:12px;display:flex;flex-direction:column;overflow-y:auto}
.card{flex:1;border-radius:20px;background-color:#e9ecef;background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.15)}
.ov{background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);padding:20px;color:#fff}
.acts{display:flex;justify-content:center;gap:25px;padding:15px 0}
.act{width:60px;height:60px;border-radius:50%;border:none;font-size:24px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,0.15)}
.ad{background:#f8f9fa;min-height:55px;display:flex;justify-content:center;align-items:center;border-top:1px solid #eee;font-size:12px;color:#999}
.nav{display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee;background:#fff}
.ni{font-size:13px;color:#888;text-align:center;cursor:pointer}
.ni.on{color:#ff4b6e;font-weight:bold}
.sec{display:none;flex:1;flex-direction:column}
.sec.on{display:flex}
.msg{padding:10px 14px;border-radius:15px;margin:5px 0;max-width:80%;font-size:14px}
.me{background:#ff4b6e;color:#fff;align-self:flex-end}
.th{background:#eee;color:#333;align-self:flex-start}
</style>
</head>
<body>
<div class="app">
  <div id="auth">
    <div class="box">
      <h2>🔥 AmoreItalia</h2>
      <p style="font-size:13px;color:#666;margin-bottom:10px">Incontra persone in tutta Italia</p>
      <input type="text" id="rName" placeholder="Il tuo Nome">
      <input type="number" id="rAge" placeholder="Età (es. 25)">
      <select id="rCity"><option>Roma</option><option>Milano</option><option>Napoli</option><option>Torino</option></select>
      <button type="button" class="btn" onclick="startApp()">Entra Ora ❤</button>
    </div>
  </div>
  <div class="hdr"><div class="logo">🔥 AmoreItalia</div><span id="uBadge" style="font-size:12px;color:#666"></span></div>
  <div id="s1" class="main sec on">
    <div class="card" id="pCard"><div class="ov"><h2 id="pName">Giulia, 25</h2><p id="pCity">📍 Roma</p></div></div>
    <div class="acts">
      <button class="act" style="background:#fff;color:#ff4b6e" onclick="nextP(false)">✖</button>
      <button class="act" style="background:#ff4b6e;color:#fff" onclick="nextP(true)">❤</button>
    </div>
  </div>
  <div id="s2" class="main sec">
    <h3 style="margin-bottom:10px">Chat</h3>
    <div id="cBox" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:10px 0">
      <div class="msg th">Ciao! Benvenuto su AmoreItalia 😊</div>
    </div>
    <div style="display:flex;gap:5px"><input id="cIn" placeholder="Scrivi..."><button class="btn" style="width:auto;margin:0;padding:0 18px" onclick="sendM()">Invia</button></div>
  </div>
  <div class="ad">
    <!-- Vendosni këtu kodin e plotë të reklamës (me linkun .js të saktë) -->
    <span>Spazio Pubblicitario</span>
  </div>
  <div class="nav">
    <div class="ni on" onclick="tab(1,this)">🔥 Scopri</div>
    <div class="ni" onclick="tab(2,this)">💬 Chat</div>
  </div>
</div>
<script>
const list=[
  {n:"Giulia, 25",c:"📍 Roma",i:"https://unsplash.com"},
  {n:"Marco, 29",c:"📍 Milano",i:"https://unsplash.com"},
  {n:"Sofia, 23",c:"📍 Napoli",i:"https://unsplash.com"},
  {n:"Alessandro, 31",c:"📍 Torino",i:"https://unsplash.com"}
];
let idx=0;
function startApp(){
  const n=document.getElementById('rName').value||'Ospite';
  const c=document.getElementById('rCity').value;
  document.getElementById('uBadge').innerText=n+' • '+c;
  document.getElementById('auth').style.display='none';
  showP();
}
function showP(){
  if(idx>=list.length)idx=0;
  document.getElementById('pCard').style.backgroundImage="url('"+list[idx].i+"')";
  document.getElementById('pName').innerText=list[idx].n;
  document.getElementById('pCity').innerText=list[idx].c;
}
function nextP(like){
  if(like)alert("🎉 Match con "+list[idx].n+"!");
  idx++;showP();
}
function sendM(){
  const v=document.getElementById('cIn').value;
  if(!v)return;
  document.getElementById('cBox').innerHTML+='<div class="msg me">'+v+'</div>';
  document.getElementById('cIn').value='';
}
function tab(n,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.ni').forEach(i=>i.classList.remove('on'));
  document.getElementById('s'+n).classList.add('on');
  el.classList.add('on');
}
showP();
</script>
</body>
</html>
