<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AmoreItalia - Incontri e Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        #authScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ff4b6e 0%, #ff758c 100%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px;
            color: white;
            overflow-y: auto;
        }
        .auth-box {
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .auth-box h2 {
            color: #ff4b6e;
            margin-bottom: 5px;
            text-align: center;
        }
        .auth-box p {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 15px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #555;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        .header {
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            background: #fff;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(45deg, #ff4b6e, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .city-select {
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #ddd;
            font-size: 12px;
            outline: none;
            color: #333;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }
        .card {
            flex: 1;
            border-radius: 20px;
            background-size: cover;
            background-position: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }
        .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 65%);
            padding: 20px;
            color: white;
        }
        .card-name { font-size: 24px; font-weight: bold; }
        .card-city { font-size: 14px; opacity: 0.9; margin-top: 3px; }
        .card-bio { font-size: 13px; margin-top: 6px; opacity: 0.85; }
        .actions {
            display: flex;
            justify-content: center;
            gap: 22px;
            padding: 12px 0;
        }
        .btn-action {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-action:active { transform: scale(0.92); }
        .btn-pass { background: #fff; color: #ff4b6e; border: 1px solid #eee; }
        .btn-super { background: #fff; color: #00b4d8; width: 46px; height: 46px; font-size: 18px; margin-top: 5px; border: 1px solid #eee; }
        .btn-like { background: linear-gradient(45deg, #ff4b6e, #ff758c); color: white; }
        .ad-banner {
            background-color: #f8f9fa;
            border-top: 1px solid #e9ecef;
            padding: 3px 0;
            text-align: center;
            min-height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: #fff;
            border-top: 1px solid #eee;
        }
        .nav-item {
            text-align: center;
            color: #999;
            font-size: 11px;
            cursor: pointer;
            font-weight: 600;
        }
        .nav-item.active { color: #ff4b6e; }
        .nav-icon { font-size: 19px; display: block; margin-bottom: 2px; }
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 150;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .modal-box {
            background: #fff;
            color: #333;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
        }
        .btn-primary {
            background: linear-gradient(45deg, #ff4b6e, #ff758c);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
        }
        .section { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
        .section.active { display: flex; }
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .chat-avatar {
            width: 50px; height: 50px; border-radius: 50%; object-fit: cover; margin-right: 12px;
        }
        #activeChatBox {
            display: none;
            flex-direction: column;
            height: 100%;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 12px;
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-bubble {
            padding: 8px 14px;
            border-radius: 16px;
            max-width: 80%;
            font-size: 14px;
        }
        .msg-me { background: #ff4b6e; color: white; align-self: flex-end; }
        .msg-them { background: #e4e6eb; color: #333; align-self: flex-start; }
        .chat-input-row {
            display: flex;
            gap: 8px;
        }
        .chat-input-row input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        .vip-plan {
            border: 2px solid #ff4b6e;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            background: #fff5f7;
        }
    </style>
</head>
<body>

<div class="app-container">

    <div id="authScreen">
        <div class="auth-box">
            <h2>🔥 AmoreItalia</h2>
            <p>Crea il tuo profilo gratuito e incontra persone in tutta Italia</p>
            
            <div class="input-group">
                <label>Il tuo Nome</label>
                <input type="text" id="regName" placeholder="Es. Luca, Elena...">
            </div>
            <div class="input-group">
                <label>Età</label>
                <input type="number" id="regAge" placeholder="Es. 26" min="18" max="99">
            </div>
            <div class="input-group">
                <label>Genere</label>
                <select id="regGender">
                    <option value="Uomo">Uomo</option>
                    <option value="Donna">Donna</option>
                </select>
            </div>
            <div class="input-group">
                <label>Città</label>
                <select id="regCity">
                    <option value="Roma">Roma</option>
                    <option value="Milano">Milano</option>
                    <option value="Napoli">Napoli</option>
                    <option value="Torino">Torino</option>
                    <option value="Firenze">Firenze</option>
                    <option value="Bologna">Bologna</option>
                </select>
            </div>
            <div class="input-group">
                <label>La tua Bio (opzionale)</label>
                <input type="text" id="regBio" placeholder="Scrivi qualcosa su di te...">
            </div>
            <button class="btn-primary" onclick="registerUser()">Entra e Incontra Ora ❤</button>
        </div>
